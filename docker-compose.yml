# Local development only. Production resources are managed by Terraform.
services:
  web:
    image: kivof-web:${WEB_IMAGE_TAG:?Set WEB_IMAGE_TAG}
    build:
      context: .
    env_file: .env
    ports:
      - "${PORT:?Set PORT}:3000"
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
